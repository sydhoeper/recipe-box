<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9f0"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><meta name="recipe-importer" content="https://recipe-box-importer.sydhoeper.workers.dev/import"><title>Little Recipe Box</title><link rel="stylesheet" href="style.css"></head><body><a class="skip" href="#main">Skip to recipes</a><div id="app"></div><dialog id="importDialog" aria-labelledby="dialogTitle"><button class="close" aria-label="Close import">×</button><div class="spark">✧</div><p class="eyebrow">A NEW KITCHEN KEEPSAKE</p><h2 id="dialogTitle">Something delicious?</h2><p>Give that recipe a place in your box.</p><form id="importForm"><label for="url">Recipe link</label><input id="url" type="url" required placeholder="https://your-favorite-recipe.com" autocomplete="url"><label for="category">File it under</label><select id="category"></select><button class="primary" type="submit">Save recipe <span>↗</span></button></form><div id="importStatus" role="status" aria-live="polite"></div><form id="manualForm" hidden><p class="note">This site doesn’t allow direct imports. Paste its recipe below to save it locally. Ingredient amounts stay beside the steps for easy cooking.</p><label for="recipeTitle">Recipe title</label><input id="recipeTitle" required><label for="chef">Chef / author</label><input id="chef"><label for="ingredients">Ingredients (one per line)</label><textarea id="ingredients" required rows="4" placeholder="2 tablespoons olive oil"></textarea><label for="instructions">Steps (one natural stopping point per line)</label><textarea id="instructions" required rows="5" placeholder="Warm 2 tablespoons olive oil in a pot. Add…"></textarea><button class="primary">Save to my box <span>＋</span></button></form></dialog><div id="toast" role="status"></div><script src="app.js?v=cloud1"></script><script type="module" src="google-auth.js?v=cloud1"></script></body></html>
